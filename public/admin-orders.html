<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>訂單管理 - 晴光蜜餞後台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <style>
        body { 
            background: #f8f9fa; 
            padding-top: 70px;
        }
        .navbar-brand { font-weight: bold; font-size: 1.4rem; }
        
        .order-card {
            margin-bottom: 24px;
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            overflow: hidden;
        }
        .order-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }
        .order-card .card-header {
            font-weight: bold;
            font-size: 1.1rem;
            padding: 16px 20px;
        }
        .status-bar {
            height: 6px;
        }
        .badge {
            font-size: 0.95em;
            padding: 6px 12px;
        }
        .order-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
        }
        #orderContainer:empty::after {
            content: "目前沒有訂單";
            display: block;
            text-align: center;
            color: #6c757d;
            font-size: 1.1rem;
            padding: 60px 20px;
        }
    </style>
</head>
<body>
    <!-- 頂部導航列 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/admin">🌟 晴光蜜餞 後台</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/admin">📊 後台首頁</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/admin-orders">📋 訂單管理</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin-products">📦 商品管理</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link text-light" href="/admin-logout">🚪 登出</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>📋 訂單管理</h1>
            <button onclick="loadOrders()" class="btn btn-outline-primary">
                🔄 重新整理
            </button>
        </div>

        <!-- 搜尋與篩選 -->
        <div class="row mb-4 g-3">
            <div class="col-md-3">
                <input type="text" id="searchReceiver" class="form-control" placeholder="搜尋收件人">
            </div>
            <div class="col-md-3">
                <input type="text" id="searchPhone" class="form-control" placeholder="搜尋電話">
            </div>
            <div class="col-md-3">
                <select id="statusFilter" class="form-select">
                    <option value="">全部狀態</option>
                    <option value="待確認">待確認</option>
                    <option value="已確認">已確認</option>
                    <option value="已出貨">已出貨</option>
                    <option value="已完成">已完成</option>
                    <option value="已取消">已取消</option>
                </select>
            </div>
            <div class="col-md-3">
                <div class="btn-group w-100" role="group">
                    <button class="btn btn-outline-primary active" data-sort="newest">最新</button>
                    <button class="btn btn-outline-primary" data-sort="oldest">最舊</button>
                    <button class="btn btn-outline-primary" data-sort="pending">待確認</button>
                    <button class="btn btn-outline-primary" data-sort="shipped">已出貨</button>
                </div>
            </div>
        </div>

        <div id="orderContainer"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/admin-orders.js"></script>
</body>
</html>
