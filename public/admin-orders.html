<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>訂單管理 - 晴光蜜餞後台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <style>
        body { 
            background: #f8f9fa; 
            padding-top: 70px; /* 為固定導航列預留空間 */
        }
        .navbar-brand {
            font-weight: bold;
            font-size: 1.4rem;
        }
        .order-card {
            margin-bottom: 20px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }
        .card-header { 
            font-weight: bold; 
            font-size: 18px;
        }
        .nav-link.active {
            font-weight: bold;
            background-color: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <!-- 頂部導航列 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/admin">
                🌟 晴光蜜餞 後台
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/admin">📊 後台首頁</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/admin-orders">📋 訂單管理</a>
                    </li>
                </ul>
                
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link text-light" href="/admin-logout">
                            🚪 登出
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 class="mb-4">📋 訂單管理</h1>

        <!-- 搜尋區 -->
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label fw-bold">🔍 搜尋收件人</label>
                <input type="text" id="searchReceiver" class="form-control" placeholder="輸入收件人姓名">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold">📱 搜尋電話</label>
                <input type="text" id="searchPhone" class="form-control" placeholder="輸入電話號碼">
            </div>
        </div>

        <!-- 排序區 -->
        <div class="mb-4">
            <label class="form-label fw-bold">🔄 排序方式</label>
            <div class="btn-group" role="group">
                <button class="btn btn-outline-primary active" data-sort="newest">最新優先</button>
                <button class="btn btn-outline-primary" data-sort="oldest">最舊優先</button>
                <button class="btn btn-outline-primary" data-sort="pending">待確認優先</button>
                <button class="btn btn-outline-primary" data-sort="shipped">已出貨優先</button>
            </div>
        </div>

        <div id="orderContainer"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/admin-orders.js"></script>
</body>
</html>
