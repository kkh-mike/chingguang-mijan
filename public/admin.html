<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>後台首頁 - 晴光蜜餞</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background: #f8f9fa; 
            padding-top: 70px;
        }
        .navbar-brand { font-weight: bold; font-size: 1.4rem; }
        .stat-card {
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .stat-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body>
    <!-- 導航列 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/admin">🌟 晴光蜜餞 後台</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" href="/admin">📊 後台首頁</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin-orders">📋 訂單管理</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin-products">📦 商品管理</a></li>
                </ul>
                <a class="nav-link text-light" href="/admin-logout">🚪 登出</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 class="mb-4 text-center">🌟 後台管理首頁</h1>
        
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card stat-card bg-primary text-white h-100">
                    <div class="card-body text-center">
                        <h5>今日訂單</h5>
                        <h2 id="todayOrders" class="display-4 fw-bold">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card bg-success text-white h-100">
                    <div class="card-body text-center">
                        <h5>本月訂單</h5>
                        <h2 id="monthOrders" class="display-4 fw-bold">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card bg-warning text-dark h-100">
                    <div class="card-body text-center">
                        <h5>本月營業額</h5>
                        <h2 id="monthRevenue" class="display-4 fw-bold">NT$ 0</h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-5">
            <h3>🔥 熱銷排行</h3>
            <ul id="hotSalesList" class="list-group"></ul>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function loadStats() {
            const res = await fetch('/api/sales-stats');
            const data = await res.json();
            document.getElementById('todayOrders').textContent = data.todayOrders;
            document.getElementById('monthOrders').textContent = data.monthOrders;
            document.getElementById('monthRevenue').textContent = `NT$ ${data.monthRevenue.toLocaleString()}`;
            
            const list = document.getElementById('hotSalesList');
            list.innerHTML = '';
            data.hotSales.forEach((item, i) => {
                const li = document.createElement('li');
                li.className = 'list-group-item d-flex justify-content-between';
                li.innerHTML = `${i+1}. ${item.product_name} <span class="badge bg-secondary">${item.total_qty} 件</span>`;
                list.appendChild(li);
            });
        }
        window.onload = loadStats;
    </script>
</body>
</html>
