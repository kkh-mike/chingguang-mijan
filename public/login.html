<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>後台登入</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2>管理員登入</h2>

    <input
        id="username"
        class="form-control mb-3"
        placeholder="帳號">

    <input
        id="password"
        type="password"
        class="form-control mb-3"
        placeholder="密碼">

    <button
        class="btn btn-primary"
        onclick="login()">
        登入
    </button>

</div>

<script>

function login() {

    const username =
        document.getElementById('username').value;

    const password =
        document.getElementById('password').value;

    if (
        username === 'admin' &&
        password === '123456'
    ) {

        localStorage.setItem(
            'isAdmin',
            'true'
        );

        location.href='/admin.html';

    } else {

        alert('帳號或密碼錯誤');

    }

}

</script>

</body>
</html>
