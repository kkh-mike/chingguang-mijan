<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>晴光蜜餞｜商品專區</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">

    <style>
        body {
            background: #fffaf3;
        }

        .navbar-brand {
            font-size: 1.5rem;
        }

        .page-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .page-title h1 {
            color: #8B4513;
            font-weight: bold;
        }

        .page-title p {
            color: #666;
            font-size: 1.1rem;
        }

        /* 商品卡片優化 */
        .product-card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: all 0.3s;
            height: 100%;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
        }

        .product-card img {
            height: 220px;
            object-fit: cover;
        }

        .price {
            color: #d35400;
            font-size: 1.35rem;
            font-weight: bold;
        }

        .btn-order {
            background: #d35400;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 10px 0;
            font-weight: 600;
        }

        .btn-order:hover {
            background: #b84300;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #666;
            font-size: 1.1rem;
        }

        #cartCount {
            font-size: 0.75rem;
        }

        /* 手機版優化 */
        @media (max-width: 576px) {
            .product-card img {
                height: 180px;
            }
            
            .page-title h1 {
                font-size: 1.8rem;
            }
            
            .price {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

<!-- Navbar（與首頁統一風格） -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            🍯 晴光蜜餞
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">首頁</a></li>
                <li class="nav-item"><a class="nav-link active" href="/products">商品專區</a></li>
                <li class="nav-item"><a class="nav-link" href="/#about">品牌故事</a></li>
                <li class="nav-item"><a class="nav-link" href="/#store">門市資訊</a></li>
            </ul>
        </div>

        <a href="/cart" class="btn btn-warning position-relative ms-3">
            🛒 購物車
            <span id="cartCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
        </a>
    </div>
</nav>

<div class="container py-5">

    <div class="page-title">
        <h1>晴光蜜餞商品專區</h1>
        <p>古早味蜜餞・休閒零嘴・伴手禮首選</p>
    </div>

    <div class="row g-4" id="productList">
        <!-- 商品由 JS 動態載入 -->
        <div class="loading col-12">
            商品載入中...
        </div>
    </div>

</div>

<script src="/js/products.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
