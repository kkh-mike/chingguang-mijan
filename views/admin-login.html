<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>後台登入 - 訂單管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
            display: flex;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            max-width: 420px;
            margin: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card card shadow">
            <div class="card-body p-5">
                <h3 class="text-center mb-4">訂單管理後台</h3>
                
                <div class="mb-3">
                    <label class="form-label">管理員密碼</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-control form-control-lg" 
                        placeholder="請輸入後台密碼">
                </div>

                <button 
                    onclick="login()" 
                    class="btn btn-primary btn-lg w-100 mb-3">
                    登入
                </button>

                <div id="message" class="text-center"></div>
            </div>
        </div>
    </div>

    <script>
    async function login() {
        const password = document.getElementById('password').value.trim();
        const messageEl = document.getElementById('message');

        if (!password) {
            messageEl.innerHTML = '<span class="text-danger">請輸入密碼</span>';
            return;
        }

        try {
            const res = await fetch('/api/admin-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password })
            });

            const data = await res.json();

            if (data.success) {
                window.location.href = data.redirect;
            } else {
                messageEl.innerHTML = `<span class="text-danger">${data.message || '登入失敗'}</span>`;
            }
        } catch (err) {
            console.error(err);
            messageEl.innerHTML = '<span class="text-danger">連線失敗，請確認伺服器是否正常運行</span>';
        }
    }

    // 按 Enter 鍵也可登入
    document.getElementById('password').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            login();
        }
    });
    </script>
</body>
</html>
