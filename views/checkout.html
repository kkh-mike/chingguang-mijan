<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>填寫訂購資料｜晴光蜜餞</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body { background: #faf7f2; }
    .delisted {
        background: #fff3cd;
        border-left: 5px solid #ffc107;
    }
</style>
</head>
<body>

<div class="container py-5">

    <h1 class="mb-4">📦 填寫訂購資料</h1>

    <div id="orderSummary" class="mb-4"></div>

    <!-- 改成非表單結構（因為不再使用 submit） -->
    <div>

        <div class="mb-3">
            <label class="form-label">收件人</label>
            <input type="text" id="receiver" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">電話</label>
            <input type="text" id="phone" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">收件地址</label>
            <textarea id="address" class="form-control" rows="3" required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">備註</label>
            <textarea id="remark" class="form-control" rows="3"></textarea>
        </div>

        <!-- 主要 LINE 送單按鈕 -->
        <button onclick="sendToLineFromCheckout()" 
                class="btn btn-lg fw-bold mt-3 w-100"
                style="background:#00C300; color:white; border:none; padding:18px; font-size:1.15rem;">
            📱 用 LINE 快速送出完整訂單
        </button>

    </div>
</div>

<script>
// 全域變數
let currentProducts = [];

// 載入最新商品狀態
async function loadCurrentProducts() {
    try {
        const res = await fetch('/api/products');
        currentProducts = await res.json();
    } catch (e) {
        console.error('載入商品失敗', e);
    }
}

// 取得商品最新資訊
function getProductInfo(id) {
    return currentProducts.find(p => p.id === id);
}

// 渲染訂單摘要
async function renderOrderSummary() {
    await loadCurrentProducts();

    const cart = JSON.parse(localStorage.getItem('shineguang_cart')) || [];
    const summaryContainer = document.getElementById('orderSummary');
    let total = 0;
    let hasDelisted = false;

    let html = `<h4>訂單明細</h4><hr>`;

    if (cart.length === 0) {
        html += `<p class="text-muted">購物車是空的</p>`;
    } else {
        cart.forEach(item => {
            const product = getProductInfo(item.id);
            
            if (!product) {
                hasDelisted = true;
                html += `
                    <div class="delisted p-3 mb-2 rounded">
                        <strong>商品已不存在</strong> 
                        <span class="badge bg-danger">已下架</span>
                    </div>`;
                return;
            }

            const isActive = product.isActive !== false;
            const subtotal = product.price * item.qty;

            if (!isActive) hasDelisted = true;

            html += `
                <div class="${isActive ? '' : 'delisted'} p-3 mb-2 rounded">
                    <div class="d-flex justify-content-between">
                        <div>
                            <strong>${product.name}</strong><br>
                            <small>${item.qty} 件 × NT$${product.price}</small>
                        </div>
                        <div class="text-end">
                            ${!isActive ? `<span class="badge bg-danger">已下架</span><br>` : ''}
                            <strong>NT$${subtotal}</strong>
                        </div>
                    </div>
                </div>`;

            if (isActive) total += subtotal;
        });
    }

    html += `<hr><h4 class="text-end">總金額：NT$<strong>${total}</strong></h4>`;

    if (hasDelisted) {
        html += `
            <div class="alert alert-warning mt-3">
                <strong>⚠️ 注意：</strong>訂單中含有已下架商品，<br>
                送出時將自動排除這些商品。
            </div>`;
    }

    summaryContainer.innerHTML = html;
    return total;
}

// LINE 快速送單（包含寫入資料庫）
async function sendToLineFromCheckout() {
    const receiver = document.getElementById('receiver').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const address = document.getElementById('address').value.trim();
    const remark = document.getElementById('remark').value.trim();

    const cart = JSON.parse(localStorage.getItem('shineguang_cart')) || [];

    if (cart.length === 0) {
        alert('購物車是空的！');
        return;
    }

    if (!receiver || !phone || !address) {
        alert('請填寫收件人、電話與收件地址');
        return;
    }

    await loadCurrentProducts();

    let totalAmount = 0;
    const validItems = [];

    cart.forEach(item => {
        const product = getProductInfo(item.id);
        if (product && product.isActive !== false) {
            validItems.push(item);
            totalAmount += Number(product.price) * Number(item.qty);
        }
    });

    if (validItems.length === 0) {
        alert('所有商品都已下架，無法送出訂單');
        return;
    }

    // 1. 先寫入資料庫（與原本 submit 相同邏輯）
    try {
        const response = await fetch('/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                receiver,
                phone,
                address,
                remark,
                totalAmount,
                items: validItems
            })
        });

        const result = await response.json();

        if (!result.success) {
            console.error('資料庫寫入失敗', result);
            // 仍然繼續送 LINE，但提醒使用者
        }
    } catch (err) {
        console.error('寫入訂單失敗', err);
        // 不阻擋使用者送 LINE
    }

    // 2. 準備 LINE 訊息
    let message = "🌟 *晴光蜜餞 - 新訂單* 🌟\n\n";

    validItems.forEach(item => {
        const product = currentProducts.find(p => p.id === item.id);
        if (product) {
            const subtotal = product.price * item.qty;
            message += `🛍️ ${product.name}\n`;
            message += `   ${item.qty} 件 × NT$${product.price} = NT$${subtotal}\n\n`;
        }
    });

    message += `──────────────────\n`;
    message += `💰 總金額：*NT$${totalAmount}*\n`;
    message += `🕒 訂單時間：${new Date().toLocaleString('zh-TW')}\n`;
    message += `──────────────────\n\n`;

    message += `👤 收件人：${receiver}\n`;
    message += `📱 電話：${phone}\n`;
    message += `📍 收件地址：${address}\n`;
    if (remark) message += `💬 備註：${remark}\n`;

    message += `\n🙏 請店家確認後回覆「確認訂單」即可\n`;
    message += `感謝您的購買！💕`;

    // 開啟 LINE
    const lineId = "@xhr6167l";
    const lineUrl = `https://line.me/R/oaMessage/${lineId}/?text=${encodeURIComponent(message)}`;
    
    window.open(lineUrl, '_blank');
    navigator.clipboard.writeText(message).catch(() => {});
    
    alert('✅ 已開啟 LINE 並複製訊息，請確認後送出！\n\n訂單已記錄至系統。');

    // 清空購物車
    localStorage.removeItem('shineguang_cart');
    
    // 可選：跳轉到成功頁面
    // window.location.href = '/success';
}

 // 頁面載入時顯示訂單摘要
window.onload = renderOrderSummary;
</script>

</body>
</html>
