<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>填寫訂購資料｜晴光蜜餞</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="container py-5">

    <h1 class="mb-4">
        📦 填寫訂購資料
    </h1>

    <form id="checkoutForm">

        <div class="mb-3">
            <label class="form-label">
                收件人
            </label>

            <input
                type="text"
                id="receiver"
                class="form-control"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">
                電話
            </label>

            <input
                type="text"
                id="phone"
                class="form-control"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">
                收件地址
            </label>

            <textarea
                id="address"
                class="form-control"
                rows="3"
                required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">
                備註
            </label>

            <textarea
                id="remark"
                class="form-control"
                rows="3"></textarea>
        </div>

        <button
            type="submit"
            class="btn btn-success btn-lg w-100">

            送出訂單

        </button>

    </form>

</div>

<script>

document
.getElementById('checkoutForm')
.addEventListener('submit', async function(e){

    e.preventDefault();

    try {

        const receiver =
            document.getElementById('receiver')
            .value
            .trim();

        const phone =
            document.getElementById('phone')
            .value
            .trim();

        const address =
            document.getElementById('address')
            .value
            .trim();

        const remark =
            document.getElementById('remark')
            .value
            .trim();

        const cart =
            JSON.parse(
                localStorage.getItem(
                    'shineguang_cart'
                )
            ) || [];

        if(cart.length === 0){

            alert('購物車是空的');

            return;
        }

        const productResponse =
            await fetch(
                '/api/products'
            );

        const products =
            await productResponse.json();

        let totalAmount = 0;

        cart.forEach(item => {

            const product =
                products.find(
                    p => p.id === item.id
                );

            if(product){

                totalAmount +=
                    Number(product.price) *
                    Number(item.qty);

            }

        });

        console.log(
            'CHECKOUT DEBUG'
        );

        console.log({
            receiver,
            phone,
            address,
            remark,
            totalAmount,
            cart
        });

        const response =
            await fetch(
                '/api/orders',
                {
                    method:'POST',

                    headers:{
                        'Content-Type':
                            'application/json'
                    },

                    body:JSON.stringify({
                        receiver,
                        phone,
                        address,
                        remark,
                        totalAmount,
                        items: cart
                    })
                }
            );

        const result =
            await response.json();

        console.log(
            'API RESULT'
        );

        console.log(result);

        if(result.success){

            localStorage.removeItem(
                'shineguang_cart'
            );

            window.location.href =
                '/success';

        }else{

            alert(
                result.message ||
                '訂單送出失敗'
            );

        }

    } catch(err){

        console.error(err);

        alert(
            '系統錯誤'
        );

    }

});

</script>

</body>
</html>
