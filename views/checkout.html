<div class="container py-5">

    <h1 class="mb-4">
        📦 填寫訂購資料
    </h1>

    <form id="checkoutForm">

        <div class="mb-3">
            <label class="form-label">
                收件人
            </label>

            <input
                type="text"
                id="receiver"
                class="form-control"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">
                電話
            </label>

            <input
                type="text"
                id="phone"
                class="form-control"
                required>
        </div>

        <div class="mb-3">
            <label class="form-label">
                收件地址
            </label>

            <textarea
                id="address"
                class="form-control"
                rows="3"
                required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">
                備註
            </label>

            <textarea
                id="remark"
                class="form-control"
                rows="3"></textarea>
        </div>

        <button
            type="submit"
            class="btn btn-success btn-lg w-100">

            送出訂單

        </button>

    </form>

</div>

<script>

document
    .getElementById('checkoutForm')
    .addEventListener('submit', function(e){

        e.preventDefault();

        window.location.href = '/success';

    });

</script>
