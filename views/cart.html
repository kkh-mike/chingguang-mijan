<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的購物車｜晴光蜜餞</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#faf7f2;
    font-family:"Microsoft JhengHei",sans-serif;
}

/* 頁面標題 */
.cart-title{
    font-size:2.2rem;
    font-weight:700;
    color:#5b3d2b;
}

/* 商品卡片 */
.cart-card{
    background:white;
    border:none;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    margin-bottom:20px;
    padding:25px;
    transition:.3s;
}

.cart-card:hover{
    transform:translateY(-3px);
}

/* 商品名稱 */
.product-name{
    font-size:1.4rem;
    font-weight:700;
    color:#333;
}

/* 價格 */
.product-price{
    color:#666;
}

/* 小計 */
.subtotal{
    color:#d35400;
    font-size:1.2rem;
    font-weight:700;
}

/* 結帳區 */
.checkout-box{
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    position:sticky;
    top:20px;
}

.total-price{
    font-size:2rem;
    color:#d35400;
    font-weight:700;
}

/* 按鈕 */
.btn-continue{
    background:#6c757d;
    border:none;
}

.btn-checkout{
    background:#2e8b57;
    border:none;
}

.btn-delete{
    border-radius:10px;
}

.empty-cart{
    text-align:center;
    padding:60px;
    color:#999;
}

.cart-card{
    background:#fff;
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.qty-btn{
    width:36px;
    height:36px;
    border-radius:50%;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container py-5">

    <h1 class="cart-title mb-4">
        🛒 我的購物車
    </h1>

    <div class="row">

        <!-- 左邊商品 -->
        <div class="col-lg-8">

            <div id="cartItems">
                <!-- JS動態產生 -->
            </div>

        </div>

        <!-- 右邊結帳 -->
        <div class="col-lg-4">

            <div class="checkout-box">

                <h4>訂單摘要</h4>

                <hr>

                <div class="mb-3">
                    總金額
                </div>

                <div id="totalPrice"
                     class="total-price">
                    NT$0
                </div>

                <div class="d-grid gap-2 mt-4">

                    <a href="/products"
                       class="btn btn-secondary btn-lg">
                        繼續購物
                    </a>

                    <!-- 修改後的主要結帳流程 -->
                    <a href="/checkout" 
                       class="btn btn-success btn-lg">
                        前往填寫收件資料並結帳
                    </a>

            

                </div>

            </div>

        </div>

    </div>

</div>

<script src="/js/cart.js"></script>

</body>
</html>
